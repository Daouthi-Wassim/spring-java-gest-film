<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Liste des films</title>
</head>
<body>
<div class="container">
    <form th:action="@{/acteur/search}" method="get" class="mb-4 d-flex">
        <input type="text" name="keyword" class="form-control me-2" placeholder="Rechercher un film par titre...">
        <button type="submit" class="btn btn-primary"><i class="ri-search-line"></i> Rechercher</button>

    </form>
    <table class="table table-hover">
        <tr>
            <th>ID</th>
            <th>nom</th>
            <th>prenom</th>
            <th>Action</th>

        </tr>
        <tr th:each="a : ${acteurs}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.nom}"></td>
            <td th:text="${a.prenom}"></td>
            <td>
                <a th:href="@{/acteur/delete/{id} (id=${a.id})}" class="btn btn-outline-danger"
                   onclick="return confirm('Voulez vous vraiment supprimer ce film?')">Supprimer</a>
                <a th:href="@{/acteur/edit/{id} (id=${a.id})}" class="btn btn-outline-warning">Mettre à jour</a>
            </td>
        </tr>
    </table>

</div>
</body>
</html>
