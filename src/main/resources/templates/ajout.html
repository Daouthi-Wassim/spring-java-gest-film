<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Liste des films</title>
</head>
<body>
<div class="container">
    <h1> Saisir un nouveau film</h1>
    <form action="/film/add" method="post">
        <p>
            <label for="titre" class="form-label"> Titre du film: </label>
            <input type="text" name="titre" id="titre" class="form-control" required>
        </p>
        <p>
            <label for="description" class="form-label">Description: </label>
            <textarea rows="5" id="description" class="form-control" name="description"></textarea>
        </p>
        <p>
            <label for="annee" class="form-label">Annee parution </label>
            <input type="number" min="1950" name="anneeparution" id="annee" class="form-control" required>
        </p>
        <p>
            <label for="categorie" class="form-label">Categorie:</label>
            <select name="categorie" id="categorie" class="form-select">
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.nom}"></option>
            </select>
        </p>
        <p>
            <label for="acteurs" class="form-label">Acteurs:</label>
            <select name="acteurs" id="acteurs" class="form-select">
                <option th:each="act : ${acteurs}"
                        th:value="${act.id}"
                        th:text="${act.nom + ' ' + act.prenom}"></option>
            </select>
        </p>
        <p>
            <input type="submit" class="btn btn-outline-primary" value="Ajouter">
        </p>
    </form>

</div>
</body>
