<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Mettre à jour le film</title>
</head>
<body>
<div class="container">
    <h1>Modifier le film</h1>
    <form th:action="@{/film/update}" th:object="${film}" method="post">
        <input type="hidden" name="id" th:value="${film.id}">
        <div class="form-group">
            <label for="titre">Titre</label>
            <input type="text" th:field="*{titre}" class="form-control" id="titre" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea th:field="*{description}" class="form-control" id="description" required></textarea>
        </div>
        <div class="form-group">
            <label for="anneeparution">Année de parution</label>
            <input type="number" th:field="*{anneeparution}" class="form-control" id="anneeparution" required>
        </div>
        <div class="form-group">
            <label for="categorie">Catégorie</label>
            <select th:field="*{categorie.id}" class="form-control" id="categorie" required>
                <option th:each="categorie : ${categories}"
                        th:value="${categorie.id}"
                        th:text="${categorie.nom}">
                </option>
            </select>
        </div>
        <div class="form-group">
            <label for="acteurs">Acteurs</label>
            <select name="acteurs" class="form-control" id="acteurs" multiple>
                <option th:each="act : ${acteurs}"
                        th:value="${act.id}"
                        th:text="${act.nom + ' ' + act.prenom}"
                       ></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Mettre à jour</button>
    </form>
</div>
</body>
</html>
