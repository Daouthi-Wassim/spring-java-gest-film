<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Liste des films</title>
</head>
<body>
<div class="container">
    <form th:action="@{/film/search}" method="get" class="mb-4 d-flex">
        <input type="text" name="keyword" class="form-control me-2" placeholder="Rechercher un film par titre...">
        <button type="submit" class="btn btn-primary"><i class="ri-search-line"></i> Rechercher</button>

    </form>
    <form th:action="@{/film/affiche}" method="get" id="categoryForm">
        <select name="idcat" onchange="document.getElementById('categoryForm').submit()">

            <option th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.nom}"
                    th:selected="${selectedCategorieId == category.id}">
            </option>
        </select>
    </form>

    <table class="table table-hover">
        <tr>
            <th>ID</th>
            <th>TITRE</th>
            <th>DESCRIPTION</th>
            <th>ANNEE PARUTION</th>
            <th>CATEGORIE</th>
            <th>Acteur</th>
            <th>Action</th>

        </tr>

        <tr th:each="f : ${films}">
            <td th:text="${f.id}"></td>
            <td th:text="${f.titre}"></td>
            <td th:text="${f.description}"></td>
            <td th:text="${f.anneeparution}"></td>
            <td th:text="${f.categorie.nom}"></td>
            <td>
                <ul>
                    <li th:each="act : ${f.acteurs}" th:text="${act.nom + ' ' + act.prenom}"></li>
                </ul>
            </td>

            <td>
                <a th:href="@{/film/delete/{id} (id=${f.id})}" class="btn btn-outline-danger"
                   onclick="return confirm('Voulez vous vraiment supprimer ce film?')">Supprimer</a>
                <a th:href="@{/film/edit/{id} (id=${f.id})}" class="btn btn-outline-warning">Mettre à jour</a>
            </td>
        </tr>
    </table>

</div>
</body>
</html>
